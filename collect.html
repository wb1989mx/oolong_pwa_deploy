<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>数据入口 - 乌龙茶识别</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a4b2d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍵</text></svg>">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "PingFang SC","Microsoft YaHei",sans-serif; background: #f6f1e9; color: #3a2a1d; min-height: 100vh; }
header { background: linear-gradient(135deg,#8a4b2d,#b06a3b); color: #fff; padding: 18px 16px 14px; position: sticky; top: 0; z-index: 10; }
header h1 { font-size: 20px; font-weight: 700; }
header p { font-size: 12px; opacity: .85; margin-top: 2px; }
nav { display: flex; background: #fff; border-bottom: 1px solid #e4d8c8; position: sticky; top: 72px; z-index: 9; }
nav a { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; color: #7a6350; text-decoration: none; border-bottom: 3px solid transparent; }
nav a.active { color: #8a4b2d; font-weight: 700; border-bottom-color: #8a4b2d; }
main { padding: 16px; max-width: 720px; margin: 0 auto; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(90,60,30,.08); }
.card h2 { font-size: 16px; margin-bottom: 10px; color: #5b3a20; }
.btn { display: inline-block; background: #8a4b2d; color: #fff; border: none; border-radius: 8px; padding: 12px 22px; font-size: 15px; cursor: pointer; }
.btn:disabled { background: #c9b8a8; cursor: not-allowed; }
.btn.secondary { background: #fff; color: #8a4b2d; border: 1.5px solid #8a4b2d; }
.drop { border: 2px dashed #c9b299; border-radius: 12px; padding: 26px 12px; text-align: center; color: #8a6b4f; background: #fbf7f0; cursor: pointer; }
.drop strong { display: block; font-size: 15px; margin-bottom: 4px; }
.drop small { font-size: 12px; }
#preview { width: 100%; max-height: 300px; object-fit: contain; border-radius: 10px; background: #efe7da; display: none; margin: 12px 0; }
label { display: block; font-size: 13px; color: #5b4a38; margin: 10px 0 6px; font-weight: 600; }
select, input[type=text] { width: 100%; padding: 11px; border: 1.5px solid #d8c9b4; border-radius: 8px; font-size: 14px; background: #fff; }
.pred { font-size: 13px; color: #8a4b2d; background: #fdf5ec; border-radius: 8px; padding: 9px 12px; margin: 10px 0; line-height: 1.6; }
.note { font-size: 12px; color: #a08a72; margin-top: 8px; line-height: 1.7; }
.item { display: flex; align-items: center; padding: 9px 0; border-bottom: 1px dashed #e8dccb; }
.item img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; margin-right: 10px; background: #efe7da; }
.item .info { flex: 1; font-size: 13px; }
.item .info .nm { font-weight: 700; }
.item .del { color: #c0392b; background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 8px; }
#count { font-size: 13px; color: #7a6350; margin: 10px 0; }
footer { text-align: center; font-size: 11px; color: #a08a72; padding: 20px 0 30px; }
</style>
</head>
<body>
<header>
  <h1>📥 数据入口</h1>
  <p>上传实拍干茶图，参与模型迭代</p>
</header>
<nav>
  <a href="index.html">识别</a>
  <a href="collect.html" class="active">数据入口</a>
  <a href="iterations.html">迭代效果</a>
</nav>
<main>
  <div class="card">
    <h2>1. 上传图片并确认品种</h2>
    <div class="drop" id="drop">
      <strong>点击选择实拍干茶图</strong>
      <small>每张图只含一个品种的干茶主体</small>
      <input type="file" id="file" accept="image/*" style="display:none">
    </div>
    <img id="preview" alt="预览">
    <label>品种（必选，用于标注训练数据）</label>
    <select id="breed">
      <option value="">— 请选择品种 —</option>
      <option>东方美人</option>
      <option>台湾乌龙</option>
      <option>安溪铁观音</option>
      <option>广东单丛</option>
      <option>武夷岩茶</option>
      <option>黄金桂</option>
    </select>
    <div class="pred" id="predBox" style="display:none"></div>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="btn" id="btnSave" disabled>确认入库</button>
      <button class="btn secondary" id="btnClear">清除</button>
    </div>
    <p class="note">流程：选图 → 模型预判（仅供参考）→ 你确认品种 → 存入待入库清单。攒够一批后导出打包，交回训练端即可并入下一轮模型迭代。</p>
  </div>

  <div class="card">
    <h2>2. 待入库清单</h2>
    <p id="count">共 0 张</p>
    <div id="list"></div>
    <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">
      <button class="btn" id="btnExport">导出数据包 (zip)</button>
      <button class="btn secondary" id="btnDelAll">清空清单</button>
    </div>
    <p class="note">导出后将生成包含图片与标注清单的 zip 文件，发送给训练端即可启动下一轮迭代。</p>
  </div>
</main>
<footer>乌龙茶品种识别系统 · 数据入口</footer>

<script src="lib/ort.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="app.js?v=2"></script>
<script>
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const breedSel = document.getElementById("breed");
const predBox = document.getElementById("predBox");
const btnSave = document.getElementById("btnSave");
const btnClear = document.getElementById("btnClear");
const btnExport = document.getElementById("btnExport");
const btnDelAll = document.getElementById("btnDelAll");
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");

let currentImg = null;
let currentFile = null;
let currentPred = null;

drop.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  const f = fileInput.files[0];
  if (!f) return;
  currentFile = f;
  preview.src = URL.createObjectURL(f);
  preview.style.display = "block";
  predBox.style.display = "none";
  currentPred = null;
  try {
    currentImg = await loadImageFromFile(f);
  } catch (e) { currentImg = null; }
  updateSave();
});

breedSel.addEventListener("change", async () => {
  updateSave();
  if (currentImg && breedSel.value && !currentPred) {
    predBox.style.display = "block";
    predBox.innerHTML = "正在用模型预判…";
    try {
      const ranked = await predict(currentImg);
      currentPred = ranked;
      const top = ranked[0];
      predBox.innerHTML =
        "模型预判：<strong>" + top.cls + "</strong>（" + fmtPct(top.prob) + "）" +
        (top.prob < 0.6 ? "<br>⚠ 置信度低，请人工核对是否干茶特写。" : "") +
        "<br><small>Top-3：" + ranked.slice(0, 3).map(r => r.cls + " " + fmtPct(r.prob)).join(" · ") + "</small>";
    } catch (e) {
      predBox.innerHTML = "预判失败：" + e.message;
    }
  }
});

function updateSave() {
  btnSave.disabled = !(currentImg && breedSel.value);
}

btnSave.addEventListener("click", async () => {
  if (!currentImg || !breedSel.value) return;
  const record = {
    breed: breedSel.value,
    ts: Date.now(),
    pred: currentPred ? currentPred.map(r => r.cls + ":" + r.prob.toFixed(3)) : null,
  };
  record.blob = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsArrayBuffer(currentFile);
  });
  await dbAdd("inbox", record);
  await refreshList();
  btnClear.click();
});

async function refreshList() {
  const items = await dbAll("inbox");
  countEl.textContent = "共 " + items.length + " 张";
  listEl.innerHTML = "";
  items.forEach(it => {
    const blob = new Blob([it.blob], { type: "image/jpeg" });
    const url = URL.createObjectURL(blob);
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML =
      '<img src="' + url + '">' +
      '<div class="info"><div class="nm">' + it.breed + "</div>" +
      '<div>' + new Date(it.ts).toLocaleString() + "</div>" +
      (it.pred && it.pred[0] ? '<div style="color:#a08a72">预判 ' + it.pred[0].split(":")[0] + "</div>" : "") +
      "</div>" +
      '<button class="del" data-id="' + it.id + '">×</button>';
    listEl.appendChild(div);
  });
  listEl.querySelectorAll(".del").forEach(b =>
    b.addEventListener("click", async () => {
      await dbDelete("inbox", Number(b.dataset.id));
      refreshList();
    })
  );
}

btnClear.addEventListener("click", () => {
  currentImg = null; currentFile = null; currentPred = null;
  fileInput.value = "";
  preview.style.display = "none";
  predBox.style.display = "none";
  breedSel.value = "";
  updateSave();
});

btnExport.addEventListener("click", async () => {
  const items = await dbAll("inbox");
  if (!items.length) { alert("清单为空"); return; }
  const zip = new JSZip();
  const folder = zip.folder("upload");
  const manifest = [];
  items.forEach((it, i) => {
    const name = it.breed + "_" + (i + 1) + ".jpg";
    folder.file(name, it.blob);
    manifest.push({ file: name, breed: it.breed, ts: it.ts, pred: it.pred });
  });
  folder.file("manifest.json", JSON.stringify(manifest, null, 2));
  const blob = await zip.generateAsync({ type: "blob" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "oolong_upload_" + Date.now() + ".zip";
  a.click();
  await dbClear("inbox");
  refreshList();
});

btnDelAll.addEventListener("click", async () => {
  if (confirm("清空全部待入库图片？")) {
    await dbClear("inbox");
    refreshList();
  }
});

refreshList();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
